<title>نبرد توپ‌ها</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;600;800&display=swap">
<style>
/* Layout: single mobile column, arcade night-arena look (deliberately dark-only), gold coin as the one loud color */
:root{
  --bg:#0d1226; --panel:#172040; --panel2:#202a54; --line:#2d3866;
  --fg:#eef1fb; --muted:#949dc4; --gold:#ffc53d; --gold-ink:#3a2700;
  --win:#4ade80; --lose:#ff6b6b; --cyan:#6ee7f9;
  --display:'Lalezar','Vazirmatn',Tahoma,sans-serif;
  --body:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.6;background:radial-gradient(120% 45% at 50% 0%,color-mix(in srgb,var(--tint,#5b7cff) 24%,#121a3c) 0%,var(--bg) 72%) fixed,var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-block:14px calc(100px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{display:flex;flex-direction:column;gap:14px}
h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:28px}
h3{font-size:19px}
small{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.top,.shop-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stat{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 10px}
.stat b{font-size:17px;font-weight:800}
.coin-ico{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,var(--gold) 45%,#c58a00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 10px rgba(255,197,61,.4);flex:none}
.league{--lc:#c8814a;border-radius:14px;padding:6px 12px}
.league div{display:flex;flex-direction:column;line-height:1.25}
.league b{color:var(--lc);font-family:var(--display);font-weight:400;font-size:18px}
.league small{font-size:12px}
.shield{width:24px;height:28px;background:linear-gradient(160deg,#fff8 0%,var(--lc) 40%);clip-path:polygon(50% 0,100% 18%,92% 70%,50% 100%,8% 70%,0 18%);flex:none}
.ladder{display:flex;flex-direction:column;gap:4px}
.ladder-bar{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden}
.ladder-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffde85,var(--gold));border-radius:6px;transition:width .4s}
.ladder small{font-size:12px}

.orb{--s:56px;width:var(--s);height:var(--s);flex:none;display:block;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.orb.lock{filter:grayscale(.9) brightness(.6)}

.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:var(--hc,#4fc3f7);opacity:.12;filter:blur(30px);pointer-events:none}
.hero .info{min-width:0;display:flex;flex-direction:column;gap:4px;position:relative}
.hero .orb{margin:-14px -10px -14px -6px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.hero h2{font-size:30px;line-height:1.1}
.lvl{display:flex;gap:4px;align-items:center}
.lvl i{width:16px;height:6px;border-radius:3px;background:var(--panel2)}
.lvl i.on{background:var(--gold);box-shadow:0 0 6px rgba(255,197,61,.5)}
.lvl small{margin-inline-start:6px;font-size:12px}
.desc{margin:0;font-size:14px}
.abil{font-size:13px;color:var(--muted)}
.abil b{color:var(--fg);font-weight:600}

.picker{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pick{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 6px 8px;border-radius:14px;border:1px solid transparent;min-width:72px}
.pick .orb{margin:-4px 0 -6px}
.pick small{font-size:12px;color:var(--muted)}
.pick[aria-pressed="true"]{border-color:var(--gold);background:var(--panel)}
.pick[aria-pressed="true"] small{color:var(--fg)}

.bet{display:flex;flex-direction:column;gap:10px}
.bet-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.bet-head small{font-size:12px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{padding:10px 0;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);box-shadow:0 0 14px rgba(255,197,61,.35)}
.chip:disabled{opacity:.35;cursor:not-allowed}

.fight{font-family:var(--display);font-size:30px;padding:12px;border-radius:18px;background:linear-gradient(180deg,#ffd76a,var(--gold));color:var(--gold-ink);box-shadow:0 5px 0 #b98400,0 10px 24px -8px rgba(255,197,61,.6);transition:transform .08s}
.fight:active{transform:translateY(3px);box-shadow:0 2px 0 #b98400}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.ghost{padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.ghost.small{padding:8px 12px;font-size:13px;flex:none}
.foot{margin:4px 0 0;text-align:center;font-size:12px;color:var(--muted)}

.back{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.card{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.card .orb{grid-row:span 2;margin:-10px -6px}
.card .body{min-width:0;display:flex;flex-direction:column;gap:3px}
.card .meta{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.card .acts{grid-column:1/-1;display:flex;gap:8px;margin-top:6px}
.card .acts button{flex:1;padding:9px;border-radius:12px;font-weight:800}
.buy{background:var(--gold);color:var(--gold-ink)}
.buy:disabled{opacity:.35;cursor:not-allowed}
.sel{border:1px solid var(--line);background:var(--panel2)}
.sel[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
#shopList{display:flex;flex-direction:column;gap:12px}

/* match */
#match{gap:10px}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.side{display:flex;flex-direction:column;gap:4px;min-width:0}
.side .nm{display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden}
.side .nm b{font-weight:800}
.side .nm small{font-size:12px;overflow:hidden;text-overflow:ellipsis}
.foe{align-items:flex-end}
.bar{height:12px;width:100%;border-radius:6px;background:var(--panel2);overflow:hidden;display:flex;position:relative}
.bar i{display:block;height:100%;border-radius:6px;transition:width .12s;box-shadow:0 0 10px currentColor}
.bar .ghostbar{position:absolute;inset-block:0;inset-inline-start:0;background:rgba(255,255,255,.35);box-shadow:none;transition:width .6s .25s}
.foe .bar .ghostbar{inset-inline-start:auto;inset-inline-end:0}
.foe .bar i:not(.ghostbar){margin-inline-start:auto;position:relative}
.me .bar i:not(.ghostbar){position:relative}
.side>small{font-size:12px;font-variant-numeric:tabular-nums}
.tag{font-size:10px;padding:0 6px;border-radius:6px;background:var(--panel2);color:var(--muted)}
.clock{font-family:var(--display);font-size:30px;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.clock.hot{color:var(--lose)}
.arena-wrap{position:relative;width:100%;aspect-ratio:1;max-width:100%;border-radius:18px;box-shadow:0 0 0 1px var(--line),0 18px 40px -16px var(--tint,#5b7cff)}
#cv{display:block;width:100%;height:100%;border-radius:18px;touch-action:none;cursor:crosshair}
.mm{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:rgba(12,17,36,.82);border-radius:18px;padding:20px}
.mm b{font-family:var(--display);font-weight:400;font-size:24px;display:block}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.nudge{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:13px}
.nudge .lbl{display:flex;align-items:center;gap:8px}
.nudge .lbl b{font-weight:800}
.pips{display:flex;gap:6px}
.pip{--p:0;width:30px;height:10px;border-radius:5px;background:var(--panel2);overflow:hidden;position:relative}
.pip::before{content:"";position:absolute;inset:0;width:calc(var(--p)*100%);background:var(--gold);border-radius:5px}
.pip.full::before{box-shadow:0 0 8px rgba(255,197,61,.7)}
.nudge small{font-size:12px}
.controls{display:flex;gap:10px;align-items:stretch}
.ability{--p:0;--c1:#888;flex:1;position:relative;overflow:hidden;border-radius:18px;padding:14px;background:var(--panel2);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.ability::before{content:"";position:absolute;inset:0;width:calc(var(--p)*100%);background:var(--c1);opacity:.35;transition:width .1s linear}
.ability.ready{background:var(--c1);border-color:#fff;color:#fff;animation:pulse 1s ease-in-out infinite;box-shadow:0 0 22px -4px var(--c1)}
.ability.ready::before{opacity:0}
.ability>span{position:relative}
.ab-name{font-family:var(--display);font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.ab-cd{font-size:13px;font-weight:600}
@keyframes pulse{50%{transform:scale(1.02)}}
.pot{text-align:center;font-size:12px;color:var(--muted)}
.pot b{color:var(--gold)}

.result{position:fixed;inset:0;display:grid;place-items:center;background:rgba(6,9,20,.78);padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.rcard{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.rcard h2{font-size:44px;line-height:1}
.rcard h2.w{color:var(--win);text-shadow:0 0 24px rgba(74,222,128,.5)} .rcard h2.l{color:var(--lose)}
.deltas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deltas div{background:var(--panel2);border-radius:14px;padding:10px;display:flex;flex-direction:column}
.deltas b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.promo{color:var(--gold);font-weight:800;margin:0}
.rcard .row2 button{padding:12px}
@media (prefers-reduced-motion:reduce){.ability.ready,.hero .orb,.rcard{animation:none}.dots::after{animation:none;content:"..."}}

/* tabs */
.tabs{position:fixed;inset:auto 0 0 0;z-index:15;background:rgba(13,18,38,.94);border-top:1px solid var(--line);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:14px;color:var(--muted);font-weight:600;font-size:13px}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{background:var(--panel2);color:var(--fg)}
.tab[aria-current="page"] svg{color:var(--gold)}
.badge{position:absolute;top:2px;inset-inline-end:calc(50% - 30px);min-width:20px;height:20px;border-radius:10px;background:var(--lose);color:#fff;font-style:normal;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.lock{filter:grayscale(1) brightness(.5)}
.coin-ico.sm{width:14px;height:14px;display:inline-block;vertical-align:-2px;box-shadow:none}
.ct{display:inline-flex;align-items:center;gap:3px;font-weight:800}

/* battle tab */
.arena-card{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9;box-shadow:0 14px 34px -16px var(--tint,#5b7cff)}
.arena-card canvas{display:block;width:100%;height:100%}
.arena-card .lbl{position:absolute;inset:auto 0 0 0;padding:30px 14px 10px;background:linear-gradient(transparent,rgba(5,8,20,.88));display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.arena-card .lbl div{display:flex;flex-direction:column}
.arena-card .lbl b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;color:#fff}
.arena-card .lbl small{color:#d3daf5;font-size:12px}
.path{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.path .st{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted);text-align:center;line-height:1.3;min-width:0}
.path img{width:100%;aspect-ratio:1;border-radius:10px;border:2px solid var(--line);display:block}
.path .st.cur img{border-color:var(--gold);box-shadow:0 0 12px -2px var(--gold)}
.path .st.cur{color:var(--fg)}
.path .st.lock img{filter:grayscale(1) brightness(.6)}
.me-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 12px 6px 6px}
.me-row img{width:68px;height:68px;margin:-6px -4px}
.me-row .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.me-row b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.2}
.me-row small{font-size:12px}
.chip-ab{align-self:flex-start;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--ac,var(--line));border-radius:999px;padding:1px 10px}
.link{color:var(--gold);font-weight:700;font-size:14px;padding:8px 10px;border-radius:10px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;min-height:128px;padding:4px 3px 8px;border-radius:16px;background:var(--panel);border:1.5px solid var(--line);font-size:11px;text-align:center;line-height:1.35;min-width:0}
.slot img{width:76px;height:76px;margin-top:-2px}
.slot small{font-size:11px}
.slot b{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.slot .hint{color:var(--muted);font-size:10.5px}
.slot.empty{border-style:dashed;background:transparent;color:var(--muted);justify-content:center}
.slot.unlocking{border-color:var(--cyan)}
.slot.unlocking b{color:var(--cyan)}
.slot.ready{border-color:var(--gold);box-shadow:0 0 18px -4px var(--gold);animation:bob 1.2s ease-in-out infinite}
.slot .go{color:var(--gold);font-family:var(--display);font-weight:400;font-size:17px}
@keyframes bob{50%{transform:translateY(-3px)}}

/* characters tab */
.detail{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.detail::after{content:"";position:absolute;inset:-60px -60px auto auto;width:200px;height:200px;border-radius:50%;background:var(--hc,#4fc3f7);opacity:.13;filter:blur(36px);pointer-events:none}
.detail>*{position:relative;z-index:1}
.detail .head{display:flex;gap:10px;align-items:center}
.detail .head img{width:124px;height:124px;margin:-14px -10px -14px -6px;flex:none}
.detail .head .info{min-width:0;display:flex;flex-direction:column;gap:3px}
.detail h2{font-size:30px;line-height:1.05}
.rar{font-size:12px;font-weight:800;color:var(--rc)}
.prog{position:relative;height:22px;border-radius:11px;background:var(--bg);overflow:hidden;border:1px solid var(--line);width:100%}
.prog i{position:absolute;inset-block:0;inset-inline-start:0;background:#3b82f6;border-radius:11px}
.prog i.ok{background:var(--win)}
.prog span{position:relative;display:block;text-align:center;font-size:12px;font-weight:800;line-height:20px;font-variant-numeric:tabular-nums}
.upbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-radius:14px;background:var(--win);color:#06301a;font-weight:800;font-size:15px;box-shadow:0 4px 0 #1f8a4c}
.upbtn:disabled{background:var(--panel2);color:var(--muted);box-shadow:none;cursor:not-allowed}
.why{font-size:12px;color:var(--muted);text-align:center;margin-top:-6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--bg);border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.stats small{font-size:11px}
.stats b{font-weight:800;font-variant-numeric:tabular-nums}
.abs{display:flex;flex-direction:column;gap:8px}
.abopt{display:grid;grid-template-columns:auto 1fr auto;gap:0 10px;align-items:center;text-align:start;padding:10px 12px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line)}
.abopt .no{grid-row:span 2;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:17px;background:var(--panel2)}
.abopt b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.3}
.abopt .cd{font-size:11.5px;color:var(--muted);white-space:nowrap}
.abopt small{grid-column:2/4;font-size:12.5px;line-height:1.5}
.abopt[aria-checked="true"]{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 0 18px -8px var(--ac)}
.abopt[aria-checked="true"] .no{background:var(--ac);color:#0d1226}
.abopt:disabled{opacity:.55;cursor:default}
.inuse{align-self:center;font-size:12.5px;font-weight:700;color:var(--gold);background:rgba(255,197,61,.1);border:1px solid rgba(255,197,61,.35);border-radius:999px;padding:3px 12px}
.lockmsg{margin:0;font-size:13px;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px 12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 3px 8px;border-radius:14px;background:var(--panel);border:1.5px solid color-mix(in srgb,var(--rc) 55%,transparent);min-width:0}
.cell img{width:70px;height:70px;margin-bottom:-4px}
.cell .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cell .lv{font-size:10.5px;color:var(--muted)}
.cell .mini{width:78%;height:5px;border-radius:3px;background:var(--bg);overflow:hidden;margin-top:2px}
.cell .mini i{display:block;height:100%;background:#3b82f6}
.cell .mini i.ok{background:var(--win)}
.cell.locked img{filter:grayscale(1) brightness(.45)}
.cell.locked .nm{color:var(--muted)}
.cell.view{background:var(--panel2);box-shadow:0 0 0 2px var(--rc)}
.cell .cur{position:absolute;top:4px;inset-inline-start:4px;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.cell .upb{position:absolute;top:3px;inset-inline-end:4px;font-size:10px;font-weight:800;color:#06301a;background:var(--win);border-radius:6px;padding:0 4px}
.shopgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.offer{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px 10px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.offer img{width:96px;height:96px;margin-bottom:-6px}
.offer b{font-size:13px}
.offer .price{display:flex;align-items:center;gap:4px;font-weight:800;background:var(--gold);color:var(--gold-ink);border-radius:10px;padding:3px 14px}
.offer:disabled{opacity:.45;cursor:not-allowed}
.test{border:1px dashed var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.test .btns{display:flex;flex-wrap:wrap;gap:6px}
.test button{padding:6px 10px;border-radius:10px;background:var(--panel2);font-size:12.5px;font-weight:600}

/* chest modal */
.cmodal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;text-align:center;cursor:pointer;
  background:radial-gradient(circle at 50% 42%,rgba(52,64,140,.97),rgba(5,8,20,.98) 70%);
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cbox{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:10px}

  const T=CHESTS[tier],lm=1+0.5*leagueOf(S.trophies),items=[];
  items.push({type:'coins',n:Math.round((T.coins[0]+Math.random()*(T.coins[1]-T.coins[0]))*lm)});
  const gn=Math.round(T.gems[0]+Math.random()*(T.gems[1]-T.gems[0]));if(gn>0)items.push({type:'gems',n:gn});
  const locked=KEYS.filter(k=>!S.lv[k]),owned=KEYS.filter(k=>S.lv[k]),used=new Set();
  let stacks=T.stacks;
  if(locked.length&&Math.random()<T.newP){const k=pickW(locked);items.push({type:'card',k,n:1,isNew:true});used.add(k);stacks--}
  const total=Math.round(T.cards*lm),shares=Array.from({length:stacks},()=>0.4+Math.random()),sum=shares.reduce((a,b)=>a+b,0);

  if(t==='laugh'){dy=-Math.abs(Math.sin(time*10))*r*0.14;rot=Math.sin(time*10)*0.07}
  else if(t==='angry')dx=Math.sin(time*45)*r*0.05;
  else if(t==='cry')dy=Math.sin(time*3)*r*0.05;
  else if(t==='love')sc=1+Math.sin(time*6)*0.04;
  else if(t==='wow')sc=1+Math.max(0,Math.sin(time*5))*0.07;
  else if(t==='thumb')rot=Math.sin(time*4)*0.05;
  c.save();c.translate(x+dx,y+dy);c.rotate(rot);c.scale(sc,sc);
  drawBall(c,{x:0,y:0,r,k,t:time,look:Math.PI/2,mood:'static',noFace:true,skin:sk,glow:6});
  emoteFace(c,t,0,0,r,time);
  c.restore();
}

frost:{n:'یخ‌شکن',dur:3.9,draw(c,T,F,ev){const A=F.A,V=F.V,fr=sg(T,0.55,1.2),tap=sg(T,1.35,1.75),cr=sg(T,1.8,2.35),sh=T>=2.45;

bomber:{n:'کادو',dur:4.2,draw(c,T,F,ev){const A=F.A,V=F.V,slide=eo(sg(T,0.3,0.8)),gx=lerp(FAX+A.r+12,FVX-V.r-14,slide),lid=sg(T,1.1,1.35),run=sg(T,1.3,1.9),boom=T>=2.1;

ghost:{n:'تسخیر',dur:4.0,draw(c,T,F,ev){const A=F.A,V=F.V,mv=eio(sg(T,0,0.6)),pos=T>=0.6&&T<1.7,yank=sg(T,1.6,2.0),def=sg(T,2.0,3.2);

dragon:{n:'نفس اژدها',dur:4.2,draw(c,T,F,ev){const A=F.A,V=F.V,inh=sg(T,0,0.65),fire=T>=0.7&&T<2.1,ch=sg(T,0.8,2.0);

function buildMap(m){

  if(m.id==='pillars')o.pillars=[[.3,.24],[.7,.24],[.3,.76],[.7,.76]].map(([x,y])=>({x:x*W,y:y*H,R:19}));

  if(m.id==='spikes')o.spikes=true;
  if(m.id==='portal')o.portals=[{bx:.18*W,by:.18*H,c:'#d06bff'},{bx:.82*W,by:.82*H,c:'#6ee7f9'}].map(p=>Object.assign(p,{x:p.bx,y:p.by}));

function mapTick(dt){

  if(M.bar){M.bar.ang+=M.bar.spd*dt;M.bar.len=M.bar.base*k}
  for(const p of M.portals){p.x=W/2+(p.bx-W/2)*k;p.y=H/2+(p.by-H/2)*k}

function tri(x1,y1,x2,y2,x3,y3){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.closePath();ctx.fill()}

function crystal(b,x,y,a,len,w,col){

const CHEST_PAL=[
  {m1:'#d08f4d',m2:'#6e3d15',t1:'#c9d2de',t2:'#4b5563',lock:'#d5dde8',gem:null,glow:null,tint:'#7a4a22'},
  {m1:'#f1f5fb',m2:'#8796ae',t1:'#5b7299',t2:'#22304a',lock:'#f3c94a',gem:'#38bdf8',glow:null,tint:'#4b6385'},
  {m1:'#ffdf70',m2:'#c47a0c',t1:'#9a5410',t2:'#4a2705',lock:'#fff1b8',gem:'#ef4444',glow:'#ffc53d',tint:'#b7791f'},
  {m1:'#a97cff',m2:'#4c1d95',t1:'#ffd75e',t2:'#9a6a0c',lock:'#ffd75e',gem:'#f0abfc',glow:'#c084fc',tint:'#6d28d9'},
  {m1:'#5eead4',m2:'#7c3aed',t1:'#fff7d6',t2:'#c08a12',lock:'#fff7d6',gem:'#fef08a',glow:'#f0abfc',tint:'#be185d',rain:true}];
function chestFill(c,P,x0,y0,x1,y1,light){
  if(P.rain){const g=c.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,'#22d3ee');g.addColorStop(0.35,'#818cf8');g.addColorStop(0.7,'#c084fc');g.addColorStop(1,'#f472b6');return g}
  const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,light?mix(P.m1,'#ffffff',0.3):P.m1);g.addColorStop(1,P.m2);return g;
}
function sideShade(c,x0,w,a){const g=c.createLinearGradient(x0,0,x0+w,0);g.addColorStop(0,`rgba(0,0,0,${a})`);g.addColorStop(0.16,'rgba(0,0,0,0)');g.addColorStop(0.84,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a+0.05})`);return g}
function gemShape(c,x,y,r,col){c.save();c.shadowColor=col;c.shadowBlur=r*1.6;c.fillStyle=col;c.beginPath();c.moveTo(x,y-r);c.lineTo(x+r*0.8,y-r*0.2);c.lineTo(x,y+r);c.lineTo(x-r*0.8,y-r*0.2);c.closePath();c.fill();c.shadowBlur=0;
  c.fillStyle='rgba(255,255,255,.75)';c.beginPath();c.moveTo(x,y-r);c.lineTo(x+r*0.35,y-r*0.35);c.lineTo(x,y-r*0.1);c.lineTo(x-r*0.35,y-r*0.35);c.closePath();c.fill();
  c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=Math.max(0.8,r*0.12);c.beginPath();c.moveTo(x,y-r);c.lineTo(x+r*0.8,y-r*0.2);c.lineTo(x,y+r);c.lineTo(x-r*0.8,y-r*0.2);c.closePath();c.stroke();c.restore()}
function drawChest(c,x,y,s,tier,o){
  o=o||{};
  const P=CHEST_PAL[tier],open=o.open||0,w=s,bh=s*0.38,lh=s*0.3,bx=x-w/2,bot=y+s*0.3,top=bot-bh,rad=s*0.05,lw=Math.max(1,s*0.016);
  const cbw=w*0.1,cbx=[bx+w*0.07,bx+w*0.93-cbw];
  c.save();
  c.fillStyle='rgba(0,0,0,.38)';c.beginPath();c.ellipse(x,bot+s*0.015,w*0.54,s*0.065,0,0,TAU);c.fill();
  // body
  c.save();if(P.glow){c.shadowColor=P.glow;c.shadowBlur=s*0.28}
  rrect(c,bx,top,w,bh,rad);c.fillStyle=chestFill(c,P,bx,top,bx+w,bot);c.fill();c.restore();
  c.save();rrect(c,bx,top,w,bh,rad);c.clip();
  c.fillStyle=sideShade(c,bx,w,0.3);c.fillRect(bx,top,w,bh);
  if(tier===0){c.strokeStyle='rgba(55,25,5,.5)';c.lineWidth=s*0.012;for(let i=1;i<4;i++)ln(c,bx,top+bh*i/4,bx+w,top+bh*i/4);
    c.strokeStyle='rgba(255,220,170,.12)';c.lineWidth=s*0.006;for(let i=0;i<9;i++){const yy=top+bh*(0.05+rnd(i+3)*0.9);c.beginPath();c.moveTo(bx+w*rnd(i),yy);c.quadraticCurveTo(bx+w*rnd(i+1),yy+s*0.012,bx+w*rnd(i+2),yy);c.stroke()}}
  if(tier===3){c.fillStyle='rgba(255,215,255,.75)';for(const [px,py] of [[0.3,0.55],[0.7,0.55],[0.5,0.78]]){star(c,bx+w*px,top+bh*py,s*0.03,s*0.01,4)}}
  if(P.rain){c.globalCompositeOperation='lighter';c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.moveTo(bx+w*0.2,top);c.lineTo(bx+w*0.38,top);c.lineTo(bx+w*0.18,bot);c.lineTo(bx,bot);c.closePath();c.fill();c.globalCompositeOperation='source-over'}
  c.restore();
  // body trims
  const band=(x0,y0,ww,hh,r)=>{const g=c.createLinearGradient(0,y0,0,y0+hh);g.addColorStop(0,mix(P.t1,'#ffffff',0.25));g.addColorStop(1,P.t1);rrect(c,x0,y0,ww,hh,r);c.fillStyle=g;c.fill();c.strokeStyle=P.t2;c.lineWidth=lw;c.stroke()};
  for(const cx of cbx){band(cx,top,cbw,bh,s*0.015);c.fillStyle=P.t2;for(const f of [0.25,0.55,0.82]){circ(c,cx+cbw/2,top+bh*f,s*0.016);c.fill()}}
  band(bx,bot-s*0.065,w,s*0.065,s*0.025);
  band(bx-s*0.005,top-s*0.005,w+s*0.01,s*0.05,s*0.02);
  c.strokeStyle='rgba(0,0,0,.55)';c.lineWidth=lw;rrect(c,bx,top,w,bh,rad);c.stroke();
  // inside glow when open
  if(open>0){
    c.save();c.fillStyle='#160b04';c.beginPath();c.ellipse(x,top+s*0.01,w*0.46,s*0.05,0,0,TAU);c.fill();
    c.globalCompositeOperation='lighter';
    const g=c.createRadialGradient(x,top,1,x,top,s*0.75);g.addColorStop(0,`rgba(255,248,210,${0.95*open})`);g.addColorStop(0.35,`rgba(255,200,90,${0.45*open})`);g.addColorStop(1,'rgba(255,160,40,0)');
    c.fillStyle=g;c.beginPath();c.arc(x,top,s*0.75,0,TAU);c.fill();c.restore();
  }
  // lid
  c.save();
  const lift=open*s*0.36,sq=1-open*0.5;
  c.translate(x,top-lift);c.rotate(-open*0.08);c.scale(1,sq);
  const lidPath=()=>{c.beginPath();c.moveTo(-w/2,0);c.lineTo(-w/2,-lh*0.42);c.bezierCurveTo(-w/2,-lh*1.2,w/2,-lh*1.2,w/2,-lh*0.42);c.lineTo(w/2,0);c.closePath()};
  c.save();if(P.glow&&!open){c.shadowColor=P.glow;c.shadowBlur=s*0.2}
  lidPath();c.fillStyle=chestFill(c,P,-w/2,-lh,w/2,0,true);c.fill();c.restore();
  c.save();lidPath();c.clip();
  c.fillStyle=sideShade(c,-w/2,w,0.25);c.fillRect(-w/2,-lh*1.2,w,lh*1.2);
  if(tier===0){c.strokeStyle='rgba(55,25,5,.45)';c.lineWidth=s*0.012;for(let i=1;i<3;i++){const yy=-lh*i*0.32;ln(c,-w/2,yy,w/2,yy)}}
  for(const cx of cbx){const lx=cx-x;const g=c.createLinearGradient(0,-lh,0,0);g.addColorStop(0,mix(P.t1,'#ffffff',0.35));g.addColorStop(1,P.t1);c.fillStyle=g;c.fillRect(lx,-lh*1.2,cbw,lh*1.2);c.strokeStyle=P.t2;c.lineWidth=lw;c.strokeRect(lx,-lh*1.2,cbw,lh*1.2);
    c.fillStyle=P.t2;circ(c,lx+cbw/2,-lh*0.35,s*0.016);c.fill()}
  c.fillStyle='rgba(255,255,255,.4)';c.beginPath();c.ellipse(-w*0.2,-lh*0.72,w*0.17,lh*0.13,-0.12,0,TAU);c.fill();
  c.restore();
  band(-w/2-s*0.005,-s*0.055,w+s*0.01,s*0.055,s*0.02);
  c.strokeStyle='rgba(0,0,0,.55)';c.lineWidth=lw;lidPath();c.stroke();
  if(tier>=3)gemShape(c,0,-lh*0.98,s*0.06,P.gem);
  c.restore();
  // lock plate
  const py=top-s*0.06*(1-open)+open*s*0.02,pw=w*0.2,ph=s*0.17*(1-open*0.35);
  const pg=c.createLinearGradient(0,py,0,py+ph);pg.addColorStop(0,mix(P.lock,'#ffffff',0.35));pg.addColorStop(1,P.lock);
  rrect(c,x-pw/2,py,pw,ph,s*0.03);c.fillStyle=pg;c.fill();c.strokeStyle=P.t2;c.lineWidth=lw;c.stroke();
  if(P.gem&&tier<3)gemShape(c,x,py+ph*0.45,s*0.045,P.gem);
  else if(tier>=3)gemShape(c,x,py+ph*0.45,s*0.05,P.gem);
  else{c.fillStyle='#2b2f36';circ(c,x,py+ph*0.38,s*0.022);c.fill();c.fillRect(x-s*0.01,py+ph*0.4,s*0.02,ph*0.35)}
  if(o.sparkle&&tier>=3){c.fillStyle='#ffffff';for(const [dx,dy,r] of [[-0.55,-0.42,0.05],[0.52,-0.58,0.04],[0.6,0.08,0.035],[-0.6,0.18,0.03]])star(c,x+dx*w,y+dy*s,s*r,s*r*0.28,4)}
  c.restore();
}
const CICON={};
function chestIcon(t){if(CICON[t]==null){const k=document.createElement('canvas');k.width=k.height=160;drawChest(k.getContext('2d'),80,84,124,t,{sparkle:true});try{CICON[t]=k.toDataURL('image/png')}catch(e){CICON[t]=''}}return CICON[t]}
function drawCoin3d(c,x,y,r){
  c.fillStyle='#9a5f06';c.beginPath();c.ellipse(x,y+r*0.22,r,r*0.42,0,0,TAU);c.fill();
  c.fillRect(x-r,y,2*r,r*0.22);
  const g=c.createRadialGradient(x-r*0.3,y-r*0.15,1,x,y,r);g.addColorStop(0,'#fff3c4');g.addColorStop(0.5,'#ffc53d');g.addColorStop(1,'#c58306');
  c.fillStyle=g;c.beginPath();c.ellipse(x,y,r,r*0.42,0,0,TAU);c.fill();
  c.strokeStyle='rgba(255,240,190,.8)';c.lineWidth=Math.max(1,r*0.08);c.beginPath();c.ellipse(x,y,r*0.7,r*0.28,0,0,TAU);c.stroke();
}
function drawGem3d(c,x,y,r){
  const pts=[[-0.6,-0.45],[0.6,-0.45],[1,0],[0,1],[-1,0]];
  c.save();c.translate(x,y);
  c.beginPath();pts.forEach(([a,b],i)=>i?c.lineTo(a*r,b*r):c.moveTo(a*r,b*r));c.closePath();
  const g=c.createLinearGradient(0,-r,0,r);g.addColorStop(0,'#a7f3d0');g.addColorStop(0.5,'#34d399');g.addColorStop(1,'#047857');c.fillStyle=g;c.fill();
  c.strokeStyle='#064e3b';c.lineWidth=Math.max(1,r*0.09);c.stroke();
  c.fillStyle='rgba(255,255,255,.45)';c.beginPath();c.moveTo(-0.6*r,-0.45*r);c.lineTo(-0.15*r,-0.45*r);c.lineTo(-0.45*r,0);c.lineTo(-r,0);c.closePath();c.fill();
  c.strokeStyle='rgba(6,78,59,.5)';c.lineWidth=Math.max(0.6,r*0.04);c.beginPath();c.moveTo(-r,0);c.lineTo(r,0);c.moveTo(-0.6*r,-0.45*r);c.lineTo(-0.3*r,0);c.lineTo(0,r);c.lineTo(0.3*r,0);c.lineTo(0.6*r,-0.45*r);c.stroke();
  c.restore();
}

function spawnPup(){
  const types=['heal','power','charge'],type=types[Math.floor(Math.random()*3)],B=bounds();
  let x=null,y=null,bx=B.x0+50,by=B.y0+50;
  for(let i=0;i<40;i++){
    const tx=B.x0+40+Math.random()*(B.x1-B.x0-80),ty=B.y0+40+Math.random()*(B.y1-B.y0-80);
    if(!clearOfMap(tx,ty))continue;
    bx=tx;by=ty;
    if(G.f.every(f=>Math.hypot(f.x-tx,f.y-ty)>80)){x=tx;y=ty;break}
  }
  if(x===null){x=bx;y=by}
  G.pups.push({x,y,type,t:0});
  ring(x,y,6,PUPS[type].color,0.6,4);
  banner('جایزه روی زمین: '+PUPS[type].name,PUPS[type].color);
  for(const B2 of G.f)if(!B2.isPlayer)B2.botT=Math.min(B2.botT,0.35+Math.max(0.1,1.1-G.li*0.2)*Math.random());
}
function botThink(B,A,dt){
  if(B.abilityCd<=0){B.aiDelay-=dt;if(B.aiDelay<=0){useAbility(B);B.aiDelay=0.6+Math.random()*3}}
  B.botT-=dt;
  if(B.botT>0||B.charges<1)return;
  const C=CLASSES[B.cls],p=G.pups[0];
  let tx,ty;
  if(p&&Math.random()<0.8){tx=p.x;ty=p.y}
  else if(C.melee){tx=A.x+A.vx*0.15;ty=A.y+A.vy*0.15}
  else{const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1,b=bounds();
    tx=Math.min(b.x1-30,Math.max(b.x0+30,B.x+dx/d*120+(Math.random()-0.5)*80));
    ty=Math.min(b.y1-30,Math.max(b.y0+30,B.y+dy/d*120+(Math.random()-0.5)*80))}
  nudge(B,tx,ty);
  B.botT=Math.max(0.7,2.6-G.li*0.35)+Math.random()*1.4;
}

const KEYDIR={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],KeyW:[0,-1],KeyS:[0,1],KeyA:[-1,0],KeyD:[1,0]};

});

const ZCOL={fire:'#fb7185',acid:'#9cf28a',tornado:'#5eead4',rainbow:'#f5d0fe',dust:'#e9d5ff'};
function update(dt){
  G.clock+=dt;
  if(G.emo){G.emo.forEach(e=>e.life-=dt);G.emo=G.emo.filter(e=>e.life>0)}if(G.emoCd>0)G.emoCd-=dt;
  G.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.9;p.vy*=0.9;p.life-=dt});G.parts=G.parts.filter(p=>p.life>0);
  G.texts.forEach(t=>{t.y-=36*dt;t.life-=dt});G.texts=G.texts.filter(t=>t.life>0);
  G.beams.forEach(b=>b.life-=dt);G.beams=G.beams.filter(b=>b.life>0);
  G.bolts.forEach(b=>b.life-=dt);G.bolts=G.bolts.filter(b=>b.life>0);
  G.rings.forEach(r=>{r.life-=dt;r.r=r.r0+(1-r.life/r.max)*r.grow});G.rings=G.rings.filter(r=>r.life>0);
  G.taps.forEach(t=>t.life-=dt);G.taps=G.taps.filter(t=>t.life>0);
  if(G.banner){G.banner.life-=dt;if(G.banner.life<=0)G.banner=null}
  G.shake=Math.max(0,G.shake-30*dt);
  for(const f of G.f){f.ghost+=(f.hp-f.ghost)*Math.min(1,dt*3);if(f.ghost<f.hp)f.ghost=f.hp}
  if(G.phase==='finish'){finUpdate(dt);return}
  if(G.phase==='count'){const pc=Math.ceil(G.count);G.count-=dt;if(G.count>0&&Math.ceil(G.count)!==pc)sfx('count');if(G.count<=0){G.phase='fight';banner('شروع!','#ffc53d');sfx('go')}return}
  if(G.phase!=='fight')return;
  G.time+=dt;
  if(G.time>=SHRINK_AT){
    if(!G.shrinkWarned){G.shrinkWarned=true;banner('زمین کوچک می‌شود!','#ff6b6b')}
    G.ins=Math.min(SHRINK_MAX*W/360,(G.time-SHRINK_AT)/(MATCH_TIME-SHRINK_AT)*SHRINK_MAX*W/360);
  }
  if(G.pupAt.length&&G.time>=G.pupAt[0]){G.pupAt.shift();spawnPup()}
  const B0=bounds();
  mapTick(dt);
  for(const f of G.f){
    if(f.out)continue;
    const C=CLASSES[f.cls];
    f.rootT-=dt;f.dazeT-=dt;f.charmT-=dt;f.bubbleT-=dt;f.cocoonT-=dt;f.lifeT-=dt;f.warT-=dt;f.healHitT-=dt;f.rainbowT-=dt;
    f.slowT-=dt;f.freezeT-=dt;f.reflectT-=dt;f.invisT-=dt;f.rapidT-=dt;f.thirstT-=dt;f.zapFastT-=dt;f.spikyT-=dt;f.stoneT-=dt;f.dmgRedT-=dt;f.kbT-=dt;
    f.hitCd-=dt;f.flash-=dt;f.buffT-=dt;f.invulnT-=dt;f.boostT-=dt;f.powT-=dt;f.abilityCd=Math.max(0,f.abilityCd-dt);
    if(f.charges<NUDGE_MAX){f.chargeT+=dt;if(f.chargeT>=NUDGE_RECHARGE){f.charges++;f.chargeT=0}}else f.chargeT=0;
    const bt=Math.max(f.boostT,f.kbT),boost=bt>0?BOOST_MUL*Math.min(1.6,bt/BOOST_TIME):0;
    let buffMul=1;if(f.buffT>0)buffMul=f.cls==='rage'?1.8:f.cls==='whirlwind'?1.6:f.cls==='dragon'?1.4:f.cls==='unicorn'?1.35:1;
    if(f.thirstT>0)buffMul*=1.25;
    const want=C.speed*buffMul*(1+boost)*(f.slowT>0?0.6:1)*(f.freezeT>0?0.12:1)*(f.rootT>0||f.cocoonT>0?0.04:1)*(f.dazeT>0?0.45:1);
    let ang=Math.atan2(f.vy,f.vx)+(bt>0?0:(Math.random()-0.5)*0.03);
    if(f.charmT>0&&f.charmBy&&bt<=0){const ta=Math.atan2(f.charmBy.y-f.y,f.charmBy.x-f.x);let df=ta-ang;while(df>Math.PI)df-=TAU;while(df<-Math.PI)df+=TAU;ang+=clamp(df,-4*dt,4*dt)}
    f.vx=Math.cos(ang)*want;f.vy=Math.sin(ang)*want;
    f.x+=f.vx*dt;f.y+=f.vy*dt;

    if(f.poison>0){
      f.poisonAcc+=f.poison*CLASSES.poison.p.tick*dt;

  if(d<mn&&d>0){

  for(const ar of G.arrows){

      const cur=Math.atan2(ar.vy,ar.vx);let df=Math.atan2(e.y-ar.y,e.x-ar.x)-cur;while(df>Math.PI)df-=TAU;while(df<-Math.PI)df+=TAU;

  for(const mn of G.mines){

    const e=foesOf(mn.owner).find(q=>q.invisT<=0&&Math.hypot(mn.x-q.x,mn.y-q.y)<q.r+(mn.kind?14:8));

function endMatch(quit){
  if(G.ended)return;G.ended=true;G.phase='end';
  if(G.sim)return;
  if(quit){finishMatch(false,true);return}
  if(G.mode==='2v2'){const sc=t=>G.f.filter(f=>f.team===t).reduce((q,f)=>q+Math.max(0,f.hp)/f.maxHp,0),al=t=>G.f.some(f=>f.team===t&&f.hp>0);
    const win=!al(1)?true:!al(0)?false:sc(0)>=sc(1),w=win?0:1;G.score=[win?1:0,win?0:1];
    const atk=G.f.filter(f=>f.team===w&&f.hp>0).sort((a,b)=>(b.isPlayer?1:0)-(a.isPlayer?1:0))[0]||G.f.find(f=>f.team===w);
    const ld=G.lastDead[1-w],vic=ld||G.f.filter(f=>f.team===1-w).sort((a,b)=>(b.isPlayer?1:0)-(a.isPlayer?1:0))[0];
    G.f.forEach(f=>{if(f!==atk&&f!==vic)f.out=true});renderRosters();startFinish(w,atk,vic);return}
  const [A,B]=G.f,win=B.hp<=0?true:A.hp<=0?false:A.hp/A.maxHp>=B.hp/B.maxHp;
  const w=win?0:1,l=1-w,wf=G.f[w],lf=G.f[l],we=G.teams[w][G.active[w]],le=G.teams[l][G.active[l]];
  we.hp=Math.max(1,wf.hp);we.revived=wf.revived;le.hp=0;le.alive=false;
  G.score[w]++;G.hist.push(w);
  if(G.score[w]>=2||!G.teams[l].some(e=>e.alive)){renderRosters();startFinish(w);return}
  if(Math.random()<0.65)later(()=>sendEmote(1,w===1?pickOne(['laugh','thumb','love']):pickOne(['angry','cry','wow'])),500);
  burst(lf.x,lf.y,CLASSES[lf.cls].c1,50,1.5);ring(lf.x,lf.y,lf.r,'#ffffff',0.7,6);
  G.shake=14;G.slow=0.8;
  banner(win?'راند را بردی':'راند را باختی',win?'#4ade80':'#ff6b6b');sfx(win?'roundWin':'roundLose');
  renderRosters();
  later(()=>{
    if(G.score[w]>=2||!G.teams[l].some(e=>e.alive)){finishMatch(w===0,false);return}
    $('#ov').innerHTML=`<div class="rres"><div class="rv-top">پایان راند ${fa(G.round)}</div><h3 style="color:${win?'var(--win)':'var(--lose)'}">${win?'این راند را بردی':'این راند را باختی'}</h3>
      <div class="scoreb"><span>تو</span><b>${fa(G.score[0])}</b><span>-</span><b>${fa(G.score[1])}</b><span>${G.botName}</span></div>
      <small>${CLASSES[we.cls].name} با ${fa(Math.ceil(we.hp))} جان به راند بعد می‌رود</small><small>${CLASSES[le.cls].name} از مسابقه بیرون رفت</small></div>`;
    $('#ov').hidden=false;
    later(nextRound,2600);
  },1500);
}
function finishMatch(win,quit){
  if(G.done)return;G.done=true;G.ended=true;G.phase='end';clearTimeout(G.pickT);$('#ov').hidden=true;$('#mm').hidden=true;
  const before=leagueOf(S.trophies);
  let dt;
  if(win){dt=30;S.wins++}else{dt=-Math.min(20,S.trophies);S.losses++}
  if(G.mode==='2v2')dt=0;
  S.trophies+=dt;
  let tier=0;if(win){tier=CYCLE[S.cycle%CYCLE.length];S.cycle++}
  const slot=S.slots.findIndex(s=>!s);
  if(slot>=0)S.slots[slot]={tier,end:null};
  save();
  const after=leagueOf(S.trophies);
  later(()=>{
    sfx(win?'win':'lose');$('#rTitle').textContent=win?'بردی!':'باختی';$('#rTitle').className=win?'w':'l';
    $('#rSub').textContent=quit?'تسلیم شدی':G.mode==='2v2'?'نبرد ۲ در ۲':'';
    $('#rScore').textContent=`${fa(G.score[0])} - ${fa(G.score[1])}`;
    $('#rChest').innerHTML=slot>=0
      ?`<img src="${chestIcon(tier)}" alt=""><b>صندوقچهٔ ${CHESTS[tier].name}</b>`
      :`<b>جایگاه صندوقچه پر بود</b>`;
    $('#rTroph').textContent=sgn(dt);$('#rTroph').style.color=dt>=0?'var(--win)':'var(--lose)';
    const p=$('#rPromo');p.hidden=after===before;
    if(after!==before)p.textContent=after>before?`به آرنای ${ARENAS[after].name} رسیدی`:`به آرنای ${ARENAS[after].name} برگشتی`;
    $('#result').hidden=false;
  },quit?0:900);
}
function closeMatch(){$('#emoPanel').hidden=true;$('#finBtn').hidden=true;musicDuck(false);cancelAnimationFrame(raf);if(G)clearTimeout(G.pickT);G=null;$('#result').hidden=true;$('#ov').hidden=true;$('#mm').hidden=true}
$('#againBtn').addEventListener('click',()=>{closeMatch();startMatch()});
$('#homeBtn').addEventListener('click',()=>{closeMatch();setTab('battle')});

function drawPupIcon(type,x,y,s){
  ctx.fillStyle='#ffffff';
  if(type==='heal'){ctx.fillRect(x-s*0.18,y-s*0.55,s*0.36,s*1.1);ctx.fillRect(x-s*0.55,y-s*0.18,s*1.1,s*0.36)}

  else{ctx.strokeStyle='#ffffff';ctx.lineWidth=2.6;ctx.lineCap='round';for(const o of [-0.25,0.2]){ctx.beginPath();ctx.moveTo(x-s*0.35,y+o*s+s*0.2);ctx.lineTo(x,y+o*s-s*0.15);ctx.lineTo(x+s*0.35,y+o*s+s*0.2);ctx.stroke()}}
}

      ctx.strokeStyle='#ffffff';ctx.lineWidth=2;for(let i=0;i<3;i++){const a=i/3*Math.PI;ctx.beginPath();ctx.moveTo(f.x+Math.cos(a)*f.r*0.8,f.y+Math.sin(a)*f.r*0.8);ctx.lineTo(f.x-Math.cos(a)*f.r*0.8,f.y-Math.sin(a)*f.r*0.8);ctx.stroke()}}
    else if(f.slowT>0){ctx.strokeStyle='rgba(191,243,255,.8)';ctx.lineWidth=2;ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(f.x,f.y,f.r+7,0,TAU);ctx.stroke();ctx.setLineDash([])}
    if(f.rootT>0){ctx.save();ctx.strokeStyle='#15803d';ctx.lineWidth=3.5;ctx.lineCap='round';for(let i=0;i<4;i++){const q=i/4*TAU+0.4;ctx.beginPath();ctx.moveTo(f.x+Math.cos(q)*(f.r+10),f.y+Math.sin(q)*(f.r+10));ctx.quadraticCurveTo(f.x+Math.cos(q+0.6)*(f.r+2),f.y+Math.sin(q+0.6)*(f.r+2),f.x+Math.cos(q+1.3)*(f.r*0.5),f.y+Math.sin(q+1.3)*(f.r*0.5));ctx.stroke();ctx.fillStyle='#4ade80';ctx.beginPath();ctx.ellipse(f.x+Math.cos(q+0.5)*(f.r+4),f.y+Math.sin(q+0.5)*(f.r+4),4,2,q,0,TAU);ctx.fill()}ctx.restore()}
    if(f.dazeT>0){for(let i=0;i<3;i++){const q=t*4+i/3*TAU;ctx.fillStyle='#e9d5ff';star(ctx,f.x+Math.cos(q)*f.r*0.9,f.y-f.r*1.15+Math.sin(q)*f.r*0.25,4,1.5,4)}}
    if(f.charmT>0){for(let i=0;i<3;i++){const q=t*3+i/3*TAU;ctx.fillStyle='#f472b6';heartPath(ctx,f.x+Math.cos(q)*(f.r+9),f.y+Math.sin(q)*(f.r+9),5);ctx.fill()}}
    if(f.bubbleT>0){ctx.save();const g=ctx.createRadialGradient(f.x-f.r*0.4,f.y-f.r*0.5,2,f.x,f.y,f.r+10);g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(0.7,'rgba(165,243,252,.08)');g.addColorStop(1,'rgba(103,232,249,.4)');ctx.fillStyle=g;circ(ctx,f.x,f.y,f.r+10+Math.sin(t*5)*1.5);ctx.fill();ctx.strokeStyle='rgba(224,250,255,.85)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.ellipse(f.x-f.r*0.45,f.y-f.r*0.6,5,2.5,-0.7,0,TAU);ctx.fill();ctx.restore()}
    if(f.cocoonT>0){ctx.save();const g=ctx.createLinearGradient(f.x,f.y-f.r,f.x,f.y+f.r);g.addColorStop(0,'#fef3c7');g.addColorStop(1,'#d6b98c');ctx.fillStyle=g;ctx.globalAlpha*=0.92;ctx.beginPath();ctx.ellipse(f.x,f.y,f.r+5,f.r+9,0,0,TAU);ctx.fill();ctx.strokeStyle='rgba(146,110,60,.6)';ctx.lineWidth=1.6;for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(f.x-f.r-4,f.y+i*6+Math.sin(i)*3);ctx.quadraticCurveTo(f.x,f.y+i*6-5,f.x+f.r+4,f.y+i*6+3);ctx.stroke()}ctx.restore()}
    if(f.lifeT>0){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(t*2);ctx.shadowColor='#fde68a';ctx.shadowBlur=12;ctx.fillStyle='#fde68a';ctx.beginPath();ctx.arc(f.r+9,0,6,0.5*Math.PI,1.5*Math.PI,true);ctx.arc(f.r+11,0,5,1.5*Math.PI,0.5*Math.PI,false);ctx.fill();ctx.restore()}
    if(f.warT>0){ctx.save();const g=ctx.createRadialGradient(f.x,f.y,f.r*0.7,f.x,f.y,f.r+16);g.addColorStop(0,'rgba(251,113,133,.45)');g.addColorStop(1,'rgba(251,191,36,0)');ctx.fillStyle=g;circ(ctx,f.x,f.y,f.r+15+Math.sin(t*20)*2);ctx.fill();ctx.restore()}
    if(f.healHitT>0){for(let i=0;i<5;i++){const q=t*2.5+i/5*TAU;ctx.fillStyle=`hsl(${i*72+t*120},90%,75%)`;star(ctx,f.x+Math.cos(q)*(f.r+7),f.y+Math.sin(q)*(f.r+7),3.5,1.3,4)}}
    if(f.dotT>0){ctx.save();for(let i=0;i<2;i++){const k2=(t*1.6+i*0.5)%1;ctx.globalAlpha=1-k2;ctx.fillStyle='#fb7185';ctx.beginPath();ctx.ellipse(f.x+(i?6:-7),f.y+f.r*0.2+k2*f.r,2,3,0,0,TAU);ctx.fill()}ctx.restore()}
    if(f.reflectT>0){ctx.save();ctx.shadowColor='#f9a8d4';ctx.shadowBlur=16;ctx.strokeStyle='#f9a8d4';ctx.lineWidth=3;
      ctx.beginPath();for(let i=0;i<6;i++){const a=i/6*TAU-t*2;const px=f.x+Math.cos(a)*(f.r+9),py=f.y+Math.sin(a)*(f.r+9);i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.stroke();ctx.restore()}
    if(f.cls==='phoenix'&&!f.revived){ctx.save();ctx.shadowColor='#ffcf70';ctx.shadowBlur=8;ctx.fillStyle='#ffcf70';star(ctx,f.x+f.r*0.78,f.y+f.r*0.78,5,2,4);ctx.restore()}
    if(f.isPlayer){const my=f.y-f.r*1.62-Math.sin(t*5)*2;ctx.fillStyle='#ffc53d';ctx.beginPath();ctx.moveTo(f.x,my+8);ctx.lineTo(f.x-6,my);ctx.lineTo(f.x+6,my);ctx.closePath();ctx.fill()}
    ctx.textAlign='center';ctx.textBaseline='middle';
    for(let i=0;i<f.poison;i++){const a=i/12*TAU+t*2;ctx.fillStyle='#7ee36b';ctx.beginPath();ctx.arc(f.x+Math.cos(a)*(f.r+5),f.y+Math.sin(a)*(f.r+5),2.6,0,TAU);ctx.fill()}
    if(f.cls==='rage'&&f.rageBonus>0){ctx.font='800 12px Vazirmatn, sans-serif';ctx.fillStyle='#ffb28f';ctx.fillText('+'+fa(f.rageBonus),f.x,f.y+f.r+12)}
    ctx.globalAlpha=1;
  }

  for(const r of G.rings){ctx.globalAlpha=Math.max(0,r.life/r.max);ctx.strokeStyle=r.c;ctx.lineWidth=r.w;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke()}
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const tp of G.taps){const k=tp.life/0.45;ctx.globalAlpha=k;ctx.strokeStyle=tp.ok?'#ffc53d':'#ff6b6b';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(tp.x,tp.y,6+(1-k)*16,0,TAU);ctx.stroke();
    if(!tp.ok){ctx.font='800 12px Vazirmatn, sans-serif';ctx.fillStyle='#ff6b6b';ctx.fillText('شارژ نداری',tp.x,tp.y-18)}}
  ctx.globalCompositeOperation='lighter';
  for(const p of G.parts){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,TAU);ctx.fill()}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  for(const tx of G.texts){
    const pop=1+Math.max(0,tx.life-0.72)*3.5;
    ctx.save();ctx.translate(tx.x,tx.y);ctx.scale(pop*W/360,pop*W/360);ctx.globalAlpha=Math.min(1,tx.life*2);
    ctx.font=(tx.big?'20px Lalezar, ':'800 15px ')+'Vazirmatn, sans-serif';
    ctx.lineWidth=4;ctx.strokeStyle='rgba(5,8,20,.75)';ctx.strokeText(tx.t,0,0);ctx.fillStyle=tx.c;ctx.fillText(tx.t,0,0);ctx.restore();
  }
  drawEmotes();
  if(G.fin){ctx.setTransform(scale,0,0,scale,M*scale,M*scale);drawFinOverlay()}
  if(G.banner){
    const b=G.banner,a=Math.min(1,b.life*2.5,(b.max-b.life)*6);
    ctx.save();ctx.scale(W/360,W/360);ctx.globalAlpha=a;ctx.fillStyle='rgba(7,10,25,.65)';ctx.fillRect(0,26,360,36);
    ctx.font=(b.t.length>30?'15px':b.t.length>22?'18px':'22px')+' Lalezar, Vazirmatn, sans-serif';ctx.fillStyle=b.c;ctx.fillText(b.t,180,45);ctx.globalAlpha=1;ctx.restore();
  }
  if(G.phase==='count'){
    const n=Math.ceil(G.count),fr=G.count-Math.floor(G.count),s=1+fr*0.6;
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(s*W/360,s*W/360);ctx.globalAlpha=Math.min(1,fr*2+0.2);
    ctx.shadowColor='#ffc53d';ctx.shadowBlur=24;ctx.fillStyle='#ffc53d';ctx.font='72px Lalezar, sans-serif';ctx.fillText(fa(n),0,0);ctx.restore();
  }
}
function hud(){
  if(!G.f.length)return;
  const A=G.f[0];let TA=A,TB=G.f[1];
  if(G.mode==='2v2'){const agg=t=>{const fs=G.f.filter(f=>f.team===t);return {hp:fs.reduce((q,f)=>q+Math.max(0,f.hp),0),maxHp:Math.round(fs.reduce((q,f)=>q+f.maxHp,0)),ghost:fs.reduce((q,f)=>q+Math.max(0,f.ghost),0)}};TA=agg(0);TB=agg(1)}
  $('#meHp').style.width=(TA.hp/TA.maxHp*100)+'%';$('#foeHp').style.width=(TB.hp/TB.maxHp*100)+'%';
  $('#meGhost').style.width=(TA.ghost/TA.maxHp*100)+'%';$('#foeGhost').style.width=(TB.ghost/TB.maxHp*100)+'%';
  $('#meHpT').textContent=`${fa(Math.ceil(TA.hp))} / ${fa(TA.maxHp)}`;$('#foeHpT').textContent=`${fa(Math.ceil(TB.hp))} / ${fa(TB.maxHp)}`;
  const left=Math.max(0,Math.ceil(MATCH_TIME-G.time));
  $('#clock').textContent=fa(left);$('#clock').classList.toggle('hot',G.time>=SHRINK_AT&&G.phase==='fight');
  const btn=$('#abilityBtn'),ready=A.abilityCd<=0&&G.phase==='fight';
  btn.classList.toggle('ready',ready);btn.style.setProperty('--p',1-A.abilityCd/A.abilityMax);
  $('#abCd').textContent=ready?'آماده! بزن':`${fa(Math.ceil(A.abilityCd))} ثانیه`;
  document.querySelectorAll('#pips .pip').forEach((el,i)=>{
    const p=i<A.charges?1:i===A.charges?A.chargeT/NUDGE_RECHARGE:0;
    el.style.setProperty('--p',p);el.classList.toggle('full',p>=1);
  });
}
function loop(ts){
  if(!G)return;
  let dt=Math.min(0.033,(ts-last)/1000);last=ts;
  if(G.hitstop>0){G.hitstop-=dt;dt*=0.15}
  if(G.slow>0){G.slow-=dt;dt*=0.35}
  update(dt);draw();hud();
  raf=requestAnimationFrame(loop);
}

function validateSkins(){
  Object.keys(S.skins).forEach(k=>{S.skins[k]=(S.skins[k]||[]).filter(id=>SKINS[id]&&SKINS[id].k===k)});
  Object.keys(S.skin).forEach(k=>{if(S.skin[k]&&!(S.skins[k]||[]).includes(S.skin[k]))S.skin[k]=''});save();
}
validateSkins();
setTab('battle');
})();
</script>
